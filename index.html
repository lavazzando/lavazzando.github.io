<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Matteo Traverso – Sound Artist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Background (jit.gen port) -->
  <canvas id="bg-lines" aria-hidden="true"></canvas>

  <!-- Creatures layer -->
  <div id="creature-layer" aria-hidden="true"></div>

  <div class="frame">
    <!-- Pointer (inside the frame so it can sit between the clouds and the text) -->
    <canvas id="grad-square" width="60" height="60" aria-hidden="true"></canvas>
    <header>
      <!-- TODO: bio page (bio.html) -->
      <a class="head-link" href="bio.html" aria-label="Bio">
        <div class="site-title"><span>Matteo Traverso</span></div>
        <div class="tagline">|| sound || free improvisation ||<br>|| data processing || machine interaction ||<br>|| installation ||</div>
      </a>

      <!-- top-right cloud; its letters draw fonts from their own stream so the rest of the page keeps its fonts -->
      <nav class="links-cloud" data-font-stream="2" aria-label="Links">
        <a href="https://www.instagram.com/trawe94/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://soundcloud.com/3444444" target="_blank" rel="noopener">SoundCloud</a>
        <a href="mailto:matteo.traverso02@gmail.com">Contact</a>
      </nav>
    </header>

    <main>
      <div class="layout">
        <section id="works" class="scatter-area" aria-label="Selected works">
          <div class="icon-grid">
            <div class="icon-row">
              <a class="icon-card scatter" href="#acousmatic" aria-label="Acousmatic & multichannel">
                <img src="audio/acousmatik.png" alt="" />
                <div class="icon-caption"><span class="cap-line">acousmatic &amp; </span><span class="cap-line">multichannel</span></div>
              </a>

              <a class="icon-card scatter" href="#installations" aria-label="Installations & performances">
                <img class="icon-big" src="audio/maramao.png" alt="" />
                <div class="icon-caption"><span class="cap-line">installations &amp; </span><span class="cap-line">performances</span></div>
              </a>

              <a class="icon-card scatter" href="records.html" aria-label="Records">
                <img src="audio/records.png" alt="" />
                <div class="icon-caption">records</div>
              </a>
            </div>
          </div>
        </section>
      </div>
    </main>

  </div>

  <script src="site.js"></script>
</body>
</html>
